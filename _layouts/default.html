<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ru" }}" class="h-full">

{%- include head.html -%}

<body class='h-full bg-bg text-text font-mono'>

    <div class="gradient-mesh" aria-hidden="true">
        <div class="mesh-blob mesh-blob-1"></div>
        <div class="mesh-blob mesh-blob-2"></div>
        <div class="mesh-blob mesh-blob-3"></div>
    </div>

    <div class="noise-overlay" aria-hidden="true"></div>

    {%- include nav.html -%}

    {{ content }}

    {%- include footer.html -%}

    <div id="toast-container" style="position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 200; display: flex; flex-direction: column; gap: 10px; align-items: center;"></div>

    <style>
        html, body, *, *::before, *::after {
            transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease !important;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            line-height: 1.7;
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        h1, h2, h3 {
            line-height: 1.25;
            letter-spacing: -0.01em;
        }

        .gradient-mesh {
            position: fixed;
            inset: 0;
            z-index: -2;
            overflow: hidden;
            pointer-events: none;
        }

        .mesh-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.18;
            animation: meshFloat 25s ease-in-out infinite;
        }

        .mesh-blob-1 {
            width: 500px;
            height: 500px;
            background: #1e40af;
            top: -150px;
            left: -100px;
        }

        .mesh-blob-2 {
            width: 600px;
            height: 600px;
            background: #3b82f6;
            top: 40%;
            right: -200px;
            animation-delay: -8s;
        }

        .mesh-blob-3 {
            width: 400px;
            height: 400px;
            background: #0ea5e9;
            bottom: -100px;
            left: 30%;
            animation-delay: -16s;
        }

        @keyframes meshFloat {
            0%, 100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(50px, -30px) scale(1.05);
            }

            66% {
                transform: translate(-30px, 40px) scale(0.98);
            }
        }

        [data-theme="dark"] .mesh-blob {
            opacity: 0.22;
        }

        .noise-overlay {
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            opacity: 0.12;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        [data-theme="dark"] .noise-overlay {
            opacity: 0.07;
        }

        .bento-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        .bento-item {
            border: 1px solid var(--border);
            background: var(--surface);
            padding: 1.5rem;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease !important;
        }

            .bento-item:hover {
                transform: translateY(-4px);
                border-color: var(--accent);
                box-shadow: 0 10px 30px rgba(30, 64, 175, 0.15);
            }

            .bento-item.large {
                grid-column: span 2;
                grid-row: span 2;
            }

            .bento-item.wide {
                grid-column: span 2;
            }

        @media (max-width: 768px) {
            .bento-grid {
                grid-template-columns: 1fr;
            }

            .bento-item.large, .bento-item.wide {
                grid-column: span 1;
                grid-row: span 1;
            }
        }

        .task-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1.5rem;
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease;
        }

            .task-card::before {
                content: "";
                position: absolute;
                top: 0;
                left: 0;
                width: 4px;
                height: 100%;
                background: var(--accent);
                opacity: 0.4;
                transition: opacity 0.3s ease;
            }

            .task-card:hover {
                transform: translateY(-4px);
                border-color: var(--accent);
                box-shadow: 0 12px 32px rgba(30, 64, 175, 0.15);
            }

                .task-card:hover::before {
                    opacity: 1;
                }

        .task-problem {
            color: var(--text-dim);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 1rem;
        }

        .task-solution {
            color: var(--text);
            font-weight: 500;
            font-size: 0.95rem;
            line-height: 1.6;
            padding-left: 1rem;
            border-left: 2px solid var(--accent);
        }

        .reveal {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease !important;
        }

            .reveal.visible {
                opacity: 1;
                transform: translateY(0);
            }

        a[class*="border"], button[class*="border"] {
            transition: transform 0.3s ease, background-color 0.3s ease, color 0.3s ease !important;
        }

        /* CTA-кнопка */
        .btn-cta {
            background: var(--cta);
            color: #ffffff;
            border: 1px solid var(--cta);
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 500;
            transition: transform 0.3s ease, background-color 0.3s ease, box-shadow 0.3s ease;
        }

            /* Hover — светлая тема */
            .btn-cta:hover {
                background: #2563eb;
                border-color: #2563eb;
                transform: translateY(-3px);
                box-shadow: 0 12px 24px rgba(30, 58, 138, 0.3);
            }

        /* Hover — тёмная тема: заметно светлее */
        [data-theme="dark"] .btn-cta:hover {
            background: #475569;
            border-color: #475569;
            transform: translateY(-3px);
            box-shadow: 0 12px 24px rgba(71, 85, 105, 0.4);
        }

        /* Пульсация — светлая тема */
        .btn-pulse {
            animation: pulse 2.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(30, 58, 138, 0.5);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(30, 58, 138, 0);
            }
        }

        /* Пульсация — тёмная тема */
        [data-theme="dark"] .btn-pulse {
            animation: pulse-dark 2.5s infinite;
        }

        @keyframes pulse-dark {
            0%, 100% {
                box-shadow: 0 0 0 0 rgba(71, 85, 105, 0.5);
            }

            50% {
                box-shadow: 0 0 0 10px rgba(71, 85, 105, 0);
            }
        }

        .toast {
            background: var(--surface);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 12px 20px;
            font-size: 14px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.3s ease, transform 0.3s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

            .toast.visible {
                opacity: 1;
                transform: translateY(0);
            }

            .toast.success {
                border-color: #10b981;
            }

            .toast.error {
                border-color: #ef4444;
            }

        .form-field.error input,
        .form-field.error textarea {
            border-color: #ef4444 !important;
        }

        .form-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: 4px;
            display: none;
        }

        .form-field.error .form-error {
            display: block;
        }
    </style>

    <script>
                document.addEventListener("DOMContentLoaded", function () {
                    var reveals = document.querySelectorAll("section, .reveal");
                    reveals.forEach(function (el) { el.classList.add("reveal"); });
                    var observer = new IntersectionObserver(function (entries) {
                        entries.forEach(function (entry) {
                            if (entry.isIntersecting) entry.target.classList.add("visible");
                        });
                    }, { threshold: 0.1 });
                    reveals.forEach(function (el) { observer.observe(el); });

                    document.querySelectorAll(".magnetic, a[class*='border'], button[class*='border']").forEach(function (btn) {
                        btn.addEventListener("mousemove", function (e) {
                            var rect = btn.getBoundingClientRect();
                            var x = e.clientX - rect.left - rect.width / 2;
                            var y = e.clientY - rect.top - rect.height / 2;
                            btn.style.transform = "translate(" + (x * 0.2) + "px, " + (y * 0.2) + "px)";
                        });
                        btn.addEventListener("mouseleave", function () {
                            btn.style.transform = "";
                        });
                    });
                });

                function showToast(message, type) {
                    var container = document.getElementById("toast-container");
                    var toast = document.createElement("div");
                    toast.className = "toast " + (type || "success");
                    toast.innerHTML = '<i class="ph-check-circle"></i> ' + message;
                    container.appendChild(toast);
                    setTimeout(function () { toast.classList.add("visible"); }, 10);
                    setTimeout(function () {
                        toast.classList.remove("visible");
                        setTimeout(function () { toast.remove(); }, 300);
                    }, 4000);
                }
    </script>

</body>

</html>
